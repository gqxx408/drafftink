# 视频解码不再依赖 Rust FFmpeg 绑定（ez-ffmpeg/ffmpeg-next 与内置的 2026-07 git
# master 版 FFmpeg 存在 ABI 不兼容，编译期即失败）。运行时直接调用本地预编译的
# `third_party/ffmpeg/bin/ffmpeg.exe`，由 build.rs 将其拷贝到 exe 旁，无需任何
# 构建期环境变量。此处保留 FFMPEG_DIR 仅作 build.rs 的路径兜底（可删）。

# 本机开发代理（与系统 HTTPS_PROXY 一致）。cargo 在 Windows 上默认回退到陈旧的
# WinHTTP 系统代理（127.0.0.1:7897，未启动），会导致 crates.io 拉取失败；此处显式
# 指向可用的代理以恢复依赖下载。
[http]
proxy = "http://127.0.0.1:7890"
