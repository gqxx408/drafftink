[package]
name = "drafftink-display"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "display"
path = "src/main.rs"

[lib]
name = "drafftink_display"
path = "src/lib.rs"

[dependencies]
drafftink-core = { path = "../drafftink-core" }
drafftink-cosmos = { path = "../drafftink-cosmos" }
drafftink-mindmap = { path = "../drafftink-mindmap" }
drafftink-functions = { path = "../drafftink-functions" }
drafftink-geometry = { path = "../drafftink-geometry" }
