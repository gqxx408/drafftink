egui.workspace = true
eframe.workspace = true
serde.workspace = true
bincode.workspace = true
uuid.workspace = true
crc32fast = "1.4"
log.workspace = true
env_logger = "0.11"
simplelog = "0.12"
chrono = "0.4"
image.workspace = true
rfd.workspace = true
raw-window-handle.workspace = true
kurbo = "0.11"
lyon = "1.0"
