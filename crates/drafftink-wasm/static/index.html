<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drafftink - 作业编辑器</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1a1a;
            width: 100%;
            height: 100%;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
        }
        #loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 16px auto 0;
            border: 3px solid #444;
            border-top-color: #2196F3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading">加载中…</div>

    <script type="module">
        // Load the WASM binary and start the eframe web app.
        // The .js and .wasm files are generated by wasm-bindgen.
        import init, { start } from './drafftink_wasm.js';

        async function run() {
            try {
                await init();
                await start();
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                console.error('Failed to start Drafftink:', err);
                document.getElementById('loading').textContent = '加载失败: ' + err;
            }
        }

        run();

        // Register the Service Worker for offline caching.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.warn('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
