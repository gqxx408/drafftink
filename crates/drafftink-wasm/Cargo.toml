[package]
name = "drafftink-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drafftink-core = { path = "../drafftink-core" }
egui.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "Storage", "Location", "Navigator",
    "Crypto", "SubtleCrypto", "CryptoKey",
    "ServiceWorker", "ServiceWorkerRegistration",
    "Request", "Response", "Headers", "RequestInit", "RequestMode",
    "console",
] }
js-sys = "0.3"
