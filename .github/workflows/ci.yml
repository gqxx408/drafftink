name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🐧 安装 Linux GUI 依赖 (eframe/egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: 🦀 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

    

    
      - name: 🧪 跑全部测试
        run: cargo test --workspace --all-targets
        env:
        http_proxy: ""
        https_proxy: ""
        ALL_PROXY: ""
      - name: 🔍 Clippy 静态分析（仅核心 crate，零警告）
        run: cargo clippy -p drafftink-desktop -p enbx_importer --all-targets -- -D warnings