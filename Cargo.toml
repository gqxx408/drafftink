[workspace]
members = [
    "crates/drafftink-core",
    "crates/drafftink-cosmos",
    "crates/drafftink-app",
    "crates/drafftink-edit",
    "crates/drafftink-display",
    "crates/drafftink-render",
    "crates/drafftink-server",
    "crates/drafftink-widgets",
    "crates/drafftink-plugin-macros",
    "crates/enbx_importer",
    "crates/seewo-plugin-api",
    "crates/seewo-plugin-loader",
    "crates/plugin-enbx-importer",
    "tools/baseline_mem",
    "tools/plugin_cli",
    "plugins/format_enbx",
    "tools/enbx_viewer",
    "modules/math",
    "crates/drafftink-quiz",
    "crates/drafftink-mindmap",
    "crates/drafftink-functions",
    "crates/drafftink-geometry",
    "crates/drafftink-backend",
    "crates/drafftink-gateway",
    "crates/drafftink-enbx",
    "crates/drafftink-desktop",
    "crates/drafftink-wasm",
    "crates/drafftink-etl",
    "crates/drafftink-standards-doc",
    "crates/drafftink-pdf-extractor",
    "crates/drafftink-migrator",
]
default-members = [
    "crates/drafftink-core",
    "crates/drafftink-backend",
    "crates/drafftink-gateway",
    "crates/drafftink-enbx",
    "crates/drafftink-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "web_screen_reader", "x11"] }
egui_extras = { version = "0.29", default-features = false, features = ["image"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.14"
raw-window-handle = "0.6"
anyhow = "1"
log = "0.4"
rodio = "0.20"
wgpu = "22"
# Backend stack (pure Rust, no C deps)
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sled = "0.34"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
